aid: de-ice
name: De-Ice
description: >-
  De-Ice Technologies is a Somerville, Massachusetts deep-tech aviation startup
  building a chemical-free aircraft de-icing system that replaces conventional
  glycol spray with electrically heated strips applied to aircraft surfaces,
  removing snow and ice prior to takeoff. The technology eliminates
  weather-related departure delays, cuts glycol spraying costs, and reduces CO₂
  emissions from idling fuel burn and chemical production. Named to Time's Best
  Inventions of 2024, De-Ice counts Air Canada as its launch customer and is
  backed by Techstars. This is a physical-hardware aviation company and does not
  currently publish a public developer API, documentation, or SDK surface.
